[project]
name = "modality-value"
version = "0.1.0"
description = "Quantifying discrimination gain per unit of acquisition cost across clinical data modalities"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch>=2.4",
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "wfdb",
    "lightgbm",
    "lifelines",
    "matplotlib",
    "fastapi",
    "uvicorn[standard]",
    "gradio",
    "pydantic",
    "transformers",
    "peft",
    "datasets",
    "accelerate",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modality_value"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The venv's editable install (`_editable_impl_modality_value.pth`) points at
# whichever checkout ran `uv pip install -e .` last -- in a multi-worktree
# setup that is NOT necessarily this worktree's src/. Prepending "src" here
# (pytest >=7 core feature, no plugin needed) makes `pytest` resolve
# modality_value against *this* worktree's code regardless of which worktree
# owns the shared venv's editable-install pointer.
pythonpath = ["src"]
